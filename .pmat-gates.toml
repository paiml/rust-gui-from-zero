# PMAT quality-gate configuration
# Generated for rust-gui-from-zero — see CLAUDE.md "CB-081" section.

[gates]
run_clippy = true
clippy_strict = true
run_tests = true
test_timeout = 300
check_coverage = true
min_coverage = 100.0
check_complexity = true
max_complexity = 25

[dependency_health]
# Five GUI frameworks (iced, fltk, gtk4, relm4, eframe) pull ~354 transitive
# deps. Direct deps stay at 9. Dropping a framework defeats the demo's
# purpose, so we lift the cap rather than carry an artificial restriction.
max_transitive = 400
